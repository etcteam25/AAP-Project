---
- name: Discover Dell RAID storage via Redfish - READ ONLY
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    idrac_username: "{{ lookup('ansible.builtin.env', 'IDRAC_USERNAME') }}"
    idrac_password: "{{ lookup('ansible.builtin.env', 'IDRAC_PASSWORD') }}"
    idrac_validate_certs: false
    redfish_base: "https://{{ idrac_ip }}"

  tasks:
    - name: Validate required input and credential
      ansible.builtin.assert:
        that:
          - idrac_ip is defined
          - idrac_ip | string | length > 0
          - idrac_username | string | length > 0
          - idrac_password | string | length > 0
        fail_msg: "idrac_ip or Dell iDRAC credential is missing."
      no_log: true

    - name: Read Redfish Systems collection
      ansible.builtin.uri:
        url: "{{ redfish_base }}/redfish/v1/Systems"
        method: GET
        user: "{{ idrac_username }}"
        password: "{{ idrac_password }}"
        force_basic_auth: true
        validate_certs: "{{ idrac_validate_certs }}"
        return_content: true
        status_code: 200
      register: systems_collection
      changed_when: false
      no_log: true

    - name: Validate that a Redfish system was found
      ansible.builtin.assert:
        that:
          - systems_collection.json.Members is defined
          - systems_collection.json.Members | length > 0
        fail_msg: "No ComputerSystem resource was returned by iDRAC."

    - name: Save system URI
      ansible.builtin.set_fact:
        system_uri: "{{ systems_collection.json.Members[0]['@odata.id'] }}"

    - name: Read server identity
      ansible.builtin.uri:
        url: "{{ redfish_base }}{{ system_uri }}"
        method: GET
        user: "{{ idrac_username }}"
        password: "{{ idrac_password }}"
        force_basic_auth: true
        validate_certs: "{{ idrac_validate_certs }}"
        return_content: true
        status_code: 200
      register: system_info
      changed_when: false
      no_log: true

    - name: Show server identity
      ansible.builtin.debug:
        msg:
          - "System URI: {{ system_uri }}"
          - "Manufacturer: {{ system_info.json.Manufacturer | default('N/A') }}"
          - "Model: {{ system_info.json.Model | default('N/A') }}"
          - "SKU / NodeID: {{ system_info.json.SKU | default('N/A') }}"
          - "SerialNumber: {{ system_info.json.SerialNumber | default('N/A') }}"

    - name: Read Storage collection
      ansible.builtin.uri:
        url: "{{ redfish_base }}{{ system_uri }}/Storage"
        method: GET
        user: "{{ idrac_username }}"
        password: "{{ idrac_password }}"
        force_basic_auth: true
        validate_certs: "{{ idrac_validate_certs }}"
        return_content: true
        status_code: 200
      register: storage_collection
      changed_when: false
      no_log: true

    - name: Validate Storage collection
      ansible.builtin.assert:
        that:
          - storage_collection.json.Members is defined
          - storage_collection.json.Members | length > 0
        fail_msg: "No Redfish Storage resources were found."

    # IMPORTANT:
    # Do not use map(attribute='@odata.id'). The dot in the literal JSON key
    # is interpreted as a nested attribute path by Jinja/Ansible.
    - name: Initialize storage URI list
      ansible.builtin.set_fact:
        storage_uris: []

    - name: Collect storage resource URIs
      ansible.builtin.set_fact:
        storage_uris: "{{ storage_uris + [storage_member['@odata.id']] }}"
      loop: "{{ storage_collection.json.Members }}"
      loop_control:
        loop_var: storage_member
        label: "{{ storage_member['@odata.id'] | default('unknown-storage-member') }}"
      when:
        - storage_member['@odata.id'] is defined

    - name: Validate storage URI list
      ansible.builtin.assert:
        that:
          - storage_uris | length > 0
        fail_msg: "Storage members exist, but none contained a literal '@odata.id' key."

    - name: Read each storage resource
      ansible.builtin.uri:
        url: "{{ redfish_base }}{{ storage_uri }}"
        method: GET
        user: "{{ idrac_username }}"
        password: "{{ idrac_password }}"
        force_basic_auth: true
        validate_certs: "{{ idrac_validate_certs }}"
        return_content: true
        status_code: 200
      loop: "{{ storage_uris }}"
      loop_control:
        loop_var: storage_uri
        label: "{{ storage_uri }}"
      register: storage_results
      changed_when: false
      no_log: true

    - name: Show discovered storage resources
      ansible.builtin.debug:
        msg:
          - "Storage URI: {{ storage_result.storage_uri }}"
          - "Storage ID: {{ storage_result.json.Id | default('N/A') }}"
          - "Name: {{ storage_result.json.Name | default('N/A') }}"
          - "Description: {{ storage_result.json.Description | default('N/A') }}"
          - "Health: {{ storage_result.json.Status.Health | default('N/A') }}"
          - "State: {{ storage_result.json.Status.State | default('N/A') }}"
          - "Volumes URI: {{ storage_result.json.Volumes['@odata.id'] if (storage_result.json.Volumes is defined and storage_result.json.Volumes['@odata.id'] is defined) else 'N/A' }}"
      loop: "{{ storage_results.results }}"
      loop_control:
        loop_var: storage_result
        label: "{{ storage_result.json.Id | default(storage_result.storage_uri) }}"

    - name: Initialize volume collection URI list
      ansible.builtin.set_fact:
        volume_collection_uris: []

    - name: Collect volume collection URIs
      ansible.builtin.set_fact:
        volume_collection_uris: "{{ volume_collection_uris + [storage_result.json.Volumes['@odata.id']] }}"
      loop: "{{ storage_results.results }}"
      loop_control:
        loop_var: storage_result
        label: "{{ storage_result.json.Id | default(storage_result.storage_uri) }}"
      when:
        - storage_result.json.Volumes is defined
        - storage_result.json.Volumes['@odata.id'] is defined

    - name: Remove duplicate volume collection URIs
      ansible.builtin.set_fact:
        volume_collection_uris: "{{ volume_collection_uris | unique | list }}"

    - name: Validate volume collections were found
      ansible.builtin.assert:
        that:
          - volume_collection_uris | length > 0
        fail_msg: "No Redfish volume collection links were found on the storage resources."

    - name: Read volume collections
      ansible.builtin.uri:
        url: "{{ redfish_base }}{{ volume_collection_uri }}"
        method: GET
        user: "{{ idrac_username }}"
        password: "{{ idrac_password }}"
        force_basic_auth: true
        validate_certs: "{{ idrac_validate_certs }}"
        return_content: true
        status_code: 200
      loop: "{{ volume_collection_uris }}"
      loop_control:
        loop_var: volume_collection_uri
        label: "{{ volume_collection_uri }}"
      register: volume_collection_results
      changed_when: false
      no_log: true

    - name: Initialize flat volume member list
      ansible.builtin.set_fact:
        volume_members: []

    - name: Add members from each volume collection
      ansible.builtin.set_fact:
        volume_members: "{{ volume_members + (volume_collection_result.json.Members | default([])) }}"
      loop: "{{ volume_collection_results.results }}"
      loop_control:
        loop_var: volume_collection_result
        label: "{{ volume_collection_result.volume_collection_uri }}"

    - name: Initialize volume URI list
      ansible.builtin.set_fact:
        volume_uris: []

    - name: Collect virtual disk or volume URIs
      ansible.builtin.set_fact:
        volume_uris: "{{ volume_uris + [volume_member['@odata.id']] }}"
      loop: "{{ volume_members }}"
      loop_control:
        loop_var: volume_member
        label: "{{ volume_member['@odata.id'] | default('unknown-volume-member') }}"
      when:
        - volume_member['@odata.id'] is defined

    - name: Remove duplicate volume URIs
      ansible.builtin.set_fact:
        volume_uris: "{{ volume_uris | unique | list }}"

    - name: Validate virtual disks were found
      ansible.builtin.assert:
        that:
          - volume_uris | length > 0
        fail_msg: "No virtual disks / Redfish volumes were found."

    - name: Read each virtual disk or volume
      ansible.builtin.uri:
        url: "{{ redfish_base }}{{ volume_uri }}"
        method: GET
        user: "{{ idrac_username }}"
        password: "{{ idrac_password }}"
        force_basic_auth: true
        validate_certs: "{{ idrac_validate_certs }}"
        return_content: true
        status_code: 200
      loop: "{{ volume_uris }}"
      loop_control:
        loop_var: volume_uri
        label: "{{ volume_uri }}"
      register: volume_results
      changed_when: false
      no_log: true

    - name: Show all discovered virtual disks
      ansible.builtin.debug:
        msg:
          - "Volume URI: {{ volume_result.volume_uri }}"
          - "ID: {{ volume_result.json.Id | default('N/A') }}"
          - "Name: {{ volume_result.json.Name | default('N/A') }}"
          - "RAIDType: {{ volume_result.json.RAIDType | default('N/A') }}"
          - "Capacity GiB: {{ ((volume_result.json.CapacityBytes | default(0) | int) / 1073741824) | round(2) }}"
          - "Health: {{ volume_result.json.Status.Health | default('N/A') }}"
          - "State: {{ volume_result.json.Status.State | default('N/A') }}"
          - "Identifiers: {{ volume_result.json.Identifiers | default([]) }}"
          - "Linked drives: {{ volume_result.json.Links.Drives | default([]) if volume_result.json.Links is defined else [] }}"
      loop: "{{ volume_results.results }}"
      loop_control:
        loop_var: volume_result
        label: "{{ volume_result.json.Name | default(volume_result.json.Id | default('volume')) }}"

    - name: Show RAID1 candidate volumes
      ansible.builtin.debug:
        msg:
          - "RAID1 CANDIDATE FOUND"
          - "ID: {{ volume_result.json.Id | default('N/A') }}"
          - "Name: {{ volume_result.json.Name | default('N/A') }}"
          - "RAIDType: {{ volume_result.json.RAIDType | default('N/A') }}"
          - "Health: {{ volume_result.json.Status.Health | default('N/A') }}"
          - "State: {{ volume_result.json.Status.State | default('N/A') }}"
          - "Capacity GiB: {{ ((volume_result.json.CapacityBytes | default(0) | int) / 1073741824) | round(2) }}"
          - "Identifiers: {{ volume_result.json.Identifiers | default([]) }}"
          - "Linked drives: {{ volume_result.json.Links.Drives | default([]) if volume_result.json.Links is defined else [] }}"
      loop: "{{ volume_results.results }}"
      loop_control:
        loop_var: volume_result
        label: "{{ volume_result.json.Name | default(volume_result.json.Id | default('RAID1')) }}"
      when:
        - (volume_result.json.RAIDType | default('') | upper) == 'RAID1'

    - name: Final read-only summary
      ansible.builtin.debug:
        msg:
          - "READ-ONLY RAID discovery completed."
          - "System: {{ system_info.json.Model | default('N/A') }}"
          - "NodeID/SKU: {{ system_info.json.SKU | default('N/A') }}"
          - "Storage resources: {{ storage_uris | length }}"
          - "Volumes discovered: {{ volume_uris | length }}"
          - "No POST, PATCH, PUT, DELETE, reboot, RAID creation, boot-order change or PXE action was performed."
