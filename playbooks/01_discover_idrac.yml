---
- name: Dell iDRAC hardware and storage discovery
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    idrac_validate_certs: false
    idrac_username: "{{ lookup('ansible.builtin.env', 'IDRAC_USERNAME') }}"
    idrac_password: "{{ lookup('ansible.builtin.env', 'IDRAC_PASSWORD') }}"

  tasks:
    - name: Validate required iDRAC IP
      ansible.builtin.assert:
        that:
          - idrac_ip is defined
          - idrac_ip | string | length > 0
        fail_msg: "Provide idrac_ip from the AAP Job Template Survey."

    - name: Validate iDRAC credential injection
      ansible.builtin.assert:
        that:
          - idrac_username | length > 0
          - idrac_password | length > 0
        fail_msg: >-
          IDRAC_USERNAME and IDRAC_PASSWORD were not injected.
          Attach the iDRAC credential to the AAP Job Template.

    - name: Gather Dell PowerEdge facts from iDRAC
      ansible.builtin.include_role:
        name: dellemc.openmanage.idrac_gather_facts
      vars:
        hostname: "{{ idrac_ip }}"
        username: "{{ idrac_username }}"
        password: "{{ idrac_password }}"
        validate_certs: "{{ idrac_validate_certs }}"
        target:
          - System
          - Controller
          - PhysicalDisk
          - VirtualDisk
          - HostNIC

    - name: Show system information
      ansible.builtin.debug:
        var: system
        
    - name: Show Dell service tag mapping
      ansible.builtin.debug:
        msg:
          ChassisServiceTag: "{{ system.ChassisServiceTag | default('UNDEFINED') }}"
          ServiceTag: "{{ system.ServiceTag | default('UNDEFINED') }}"
          SerialNumber: "{{ system.SerialNumber | default('UNDEFINED') }}"

    - name: Show storage controllers
      ansible.builtin.debug:
        var: controller

    - name: Show physical disks
      ansible.builtin.debug:
        var: physical_disk

    - name: Show virtual disks
      ansible.builtin.debug:
        var: virtual_disk

    - name: Show host NIC information
      ansible.builtin.debug:
        var: hostnic


    - name: Read Redfish system identity directly
      ansible.builtin.uri:
        url: "https://{{ idrac_ip }}/redfish/v1/Systems/{{ system.Id }}"
        method: GET
        user: "{{ idrac_username }}"
        password: "{{ idrac_password }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: redfish_system

    - name: Show Redfish server identity
      ansible.builtin.debug:
        msg:
          id: "{{ redfish_system.json.Id | default('UNDEFINED') }}"
          manufacturer: "{{ redfish_system.json.Manufacturer | default('UNDEFINED') }}"
          model: "{{ redfish_system.json.Model | default('UNDEFINED') }}"
          serial_number: "{{ redfish_system.json.SerialNumber | default('UNDEFINED') }}"
          sku: "{{ redfish_system.json.SKU | default('UNDEFINED') }}"
          asset_tag: "{{ redfish_system.json.AssetTag | default('UNDEFINED') }}"
          uuid: "{{ redfish_system.json.UUID | default('UNDEFINED') }}"